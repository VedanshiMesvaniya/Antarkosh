name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio sqlglot qdrant-client pydantic pydantic-settings

      - name: Run SQL Glossary & Relationship Drift Validator
        run: |
          python src/core/sql_drift_validator.py

      - name: Run Test Suite
        env:
          DB_ENGINE: sqlite
        run: |
          pytest -v tests/test_sql_*.py tests/test_query_pipeline.py tests/test_citations_and_routing.py

      - name: Run Offline Eval Dataset Validator
        run: |
          python evals/Antarkosh/run_eval.py --offline
