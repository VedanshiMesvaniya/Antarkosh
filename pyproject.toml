[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only ship the `src` package (flat layout also has tests/, config/, etc.).
include = ["src*"]

[project]
name = "Antarkosh"
version = "0.1.0"
description = "Zero-Cost Enterprise RAG Pipeline — accuracy-first document processing with free-tier APIs"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.30",

    # Stage 1: File detection
    "python-magic>=0.4",
    "filetype>=1.2",

    # Stages 2-5: PDF parsing, layout, classification
    "PyMuPDF>=1.24",
    "pdfplumber>=0.11",

    # Stage 3: Office format parsing
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",

    # Stage 6: Table extraction
    "camelot-py[base]>=0.11",

    # Stage 10: Embeddings (local BGE-M3) and reranking (local bge-reranker-v2-m3)
    "numpy>=1.26",
    "FlagEmbedding>=1.3.5",

    # Stage 11: Vector store
    "qdrant-client>=1.9",

    # Stage 12b: Text-to-SQL retrieval
    "sqlglot>=23.0.0",   # SQL parsing / safety validation
    "aiosqlite>=0.20.0", # async SQLite for the live-data DB
    "aiomysql>=0.2",     # async MySQL support for the live-data DB
    "asyncpg>=0.29",     # async PostgreSQL support for the live-data DB

    # API server
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # Utilities
    "rich>=13.0",
    "tenacity>=8.3",
    "tiktoken>=0.7",     # stream token counting (src/utils/stream_token_counter.py)
    "portalocker>=2.8",  # cross-platform advisory file locking (Windows-safe)
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.optional-dependencies]
mysql = [
    "aiomysql>=0.2",
]
postgresql = [
    "asyncpg>=0.29",
]

[project.scripts]
Antarkosh = "src.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: needs real services (the populated MySQL database, API keys or real model weights); excluded from CI",
]
