# Feature flags for SQL Pipeline Optimization & Schema Intelligence
# Copy this file to config/feature_flags.yaml for your local configuration.

features:
  delta_repair_enabled: true
  token_budget_enabled: true
  schema_compaction_enabled: true
  sql_safety_enabled: true
  zero_row_handling_enabled: true
  fast_path_enabled: true
  sql_micro_synthesis_enabled: false
  provider_routing_v2_enabled: true
  enable_branching_traces: true
  guard_sql_safety_enforce: true
  guard_sql_soft_delete_enforce: true
  guard_sql_temporal_shadow: true
  guard_sql_temporal_enforce: false
  guard_schema_sufficiency_shadow: true
  guard_schema_sufficiency_enforce: false
  guard_rag_citation_shadow: true
  guard_rag_citation_enforce: true
  guard_decomposition_shadow: true
  enable_fallback_on_guard_failure: true

db_defaults:
  auto_scaffold: true
  auto_catalog: true
  auto_sqlalchemy: true
  auto_procedures: true
  auto_sp_mining: true
  auto_relationships: true
  auto_relationships_apply: true
  auto_table_profiles: true
  auto_join_paths: true
  auto_column_meaning: true
  auto_prompt_shadow: true
  auto_prompt_inject: true
  auto_learning: true
  auto_sync_orchestration: true
  auto_prompt_hints_apply: false
  auto_resync_apply: false
  auto_stale_chunk_cleanup: false
  auto_learning_apply: false

db_features:
  _example_db:
    auto_scaffold: false
    auto_catalog: false
    auto_sqlalchemy: false
    auto_procedures: false
    auto_sp_mining: false
    auto_relationships: false
    auto_relationships_apply: false
    auto_table_profiles: false
    auto_join_paths: false
    auto_column_meaning: false
    auto_prompt_shadow: false
    auto_prompt_inject: false
    auto_learning: false
    auto_sync_orchestration: false
    auto_prompt_hints_apply: false
    auto_resync_apply: false
    auto_stale_chunk_cleanup: false
    auto_learning_apply: false

# =============================================================================
# FEATURE DESCRIPTIONS & USAGE GUIDE
# =============================================================================
#
# --- GLOBAL FEATURES (features:) ---
#
# delta_repair_enabled:
#   On SQL error, generates an incremental repair diff instead of regenerating the entire query.
# token_budget_enabled:
#   Enforces prompt token limits, pruning lower-priority tables/columns when budget is exceeded.
# schema_compaction_enabled:
#   Strips noisy attributes and flattens column comments to minimize prompt token footprint.
# sql_safety_enabled:
#   Enforces AST checks to block destructive queries (DROP, DELETE, UPDATE, TRUNCATE) in read pipelines.
# zero_row_handling_enabled:
#   Diagnoses queries returning 0 rows and attempts filter relaxation or date range adjustments.
# fast_path_enabled:
#   Bypasses heavy multi-hop relationship resolution for simple single-table queries.
# sql_micro_synthesis_enabled:
#   Experimental fast micro-synthesis for trivial queries.
# provider_routing_v2_enabled:
#   Multi-provider routing with API key rotation, fallback models, and rate-limit mitigation.
# enable_branching_traces:
#   Emits detailed telemetry spans and execution traces for decision branching.
# guard_sql_safety_enforce:
#   Strictly blocks queries that fail AST safety verification.
# guard_sql_soft_delete_enforce:
#   Automatically injects filters to exclude soft-deleted records (e.g. is_deleted = 0).
# guard_sql_temporal_shadow:
#   Evaluates point-in-time vs current state queries in shadow mode (log only).
# guard_sql_temporal_enforce:
#   Strictly enforces temporal constraints and timestamps on queries.
# guard_schema_sufficiency_shadow:
#   Evaluates whether retrieved schema covers all needed tables/columns in shadow mode (log only).
# guard_schema_sufficiency_enforce:
#   Aborts/repairs query before execution if retrieved schema is insufficient.
# guard_rag_citation_shadow:
#   Evaluates RAG citation grounding in shadow mode (log only).
# guard_rag_citation_enforce:
#   Strictly enforces citation grounding before returning response.
# guard_decomposition_shadow:
#   Evaluates multi-part query splitting in shadow mode (log only).
# enable_fallback_on_guard_failure:
#   Falls back to standard execution if a guard encounters an unexpected exception.
#
# --- PER-DATABASE FEATURES (db_defaults: and db_features:) ---
#
# auto_scaffold:
#   Phase 1: Bootstraps folder structure and initial connection configuration in databases/<db_id>/.
# auto_catalog:
#   Phase 2: Introspects live tables, columns, primary/foreign keys, types, and row counts.
# auto_sqlalchemy:
#   Phase 3: Generates SQLAlchemy declarative models and reflection code.
# auto_procedures:
#   Phase 4: Introspects stored procedures, functions, parameters, and return signatures.
# auto_sp_mining:
#   Phase 5: Mines stored procedure code to discover hidden table relationships.
# auto_relationships:
#   Phase 6: Infers cross-table relationships and foreign key links using column heuristics.
# auto_relationships_apply:
#   Phase 6: Applies inferred relationships directly into schema context for query generation.
# auto_table_profiles:
#   Phase 7: Profiles table distributions and identifies canonical master vs backup/copy tables.
# auto_join_paths:
#   Phase 8: Pre-computes graph join paths between related tables into join_paths.json.
# auto_column_meaning:
#   Phase 9: AI enrichment of business column descriptions and domain meanings.
# auto_prompt_shadow:
#   Phase 10: Logs relationship bridge injection decisions in telemetry (shadow mode).
# auto_prompt_inject:
#   Phase 10: Injects route bridges and join paths from join_paths.json into the query prompt.
# auto_learning:
#   Phase 10: Learns verified query patterns and stores golden few-shot examples.
#   Phase 14: also records the evidence for learning real user phrasing (thumbs up/down on SQL answers) into
#   databases/<db_id>/learned/. Recording alone never changes an answer.
# auto_sync_orchestration:
#   Phase 11: End-to-end sync orchestration with pre/post validation, drift check, and rollback.
# auto_prompt_hints_apply:
#   Phase 12: Injects canonical real table for copies and adds "Table notes" into prompt (starts false).
# auto_resync_apply:
#   Phase 13: Skips phases whose input tables/schema have not changed since last sync (starts false).
# auto_stale_chunk_cleanup:
#   Phase 13: Automatically deletes vector chunks for dropped/renamed tables (starts false).
# auto_learning_apply:
#   Phase 14: lets phrases that users confirmed repeatedly (e.g. "QN" -> quality_notification) appear as hints under "Column mapping" in
#   the prompt. Curated and generated glossary entries always win; a learned phrase needs several distinct confirmed questions on more
#   than one day and no real thumbs-down. Undo: set false, or `python scripts/ops/term_pairs.py revoke --db-id <id> "<phrase>"`. Starts false.
