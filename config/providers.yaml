# Provider routing configuration
# Each task maps to an ordered fallback chain of provider+model pairs.
# The router tries them in priority order, falling back on rate-limit or error.
#
# Model IDs verified against live API endpoints, September 2026.

tasks:

  # Stage 2b — Semantic document classification
  semantic_classification:
    providers:
      - provider: gemini
        model: gemini-3.5-flash
        priority: 1
      - provider: groq
        model: openai/gpt-oss-20b
        priority: 2
      - provider: nvidia_nim
        model: nvidia/nemotron-3.5-lightning-30b-a3b
        priority: 3

  # Stages 4/5 — Vision-LLM OCR and layout analysis
  ocr_vision:
    providers:
      - provider: gemini
        model: gemini-3.5-flash
        priority: 1
      - provider: nvidia_nim
        model: meta/llama-3.2-11b-vision-instruct
        priority: 2

  layout_analysis:
