# Provider routing configuration
# Each task maps to an ordered fallback chain of provider+model pairs. The router tries them in priority order and falls back on a
# rate limit or error. Order of preference:
#   everyday tasks ........ openrouter (Google Gemma 4) -> groq -> nvidia_nim -> gemini (last resort)
#   large thinking ........ gemini first (reasoning, repair, synthesis), then ANOTHER provider's reasoning model as backup:
#                           nvidia_nim (Nemotron 3 Ultra) -> openrouter (same model) -> groq (gpt-oss-120b)
# NOTE: set DEFAULT_PROVIDER=auto (env / render.yaml). A concrete default provider is "pinned" to the front of EVERY task and
# would put openrouter ahead of gemini for the large-thinking tasks, undoing the order above.
#
# Every model is a FREE model; IDs and limits were checked on 2026-11-16 against the providers' docs and live catalogs.
# Free listings rotate (what was free in July was gone by October), so re-check before relying on one.
#   openrouter  free ":free" models, 20 requests/min and 50-200 requests/day PER MODEL (50 without credits, more after buying
#               credits; check yours at https://openrouter.ai/api/v1/key). There is NO free Gemini there: the Google models are
#               Gemma 4 (26B-A4B is the best-scoring free model, 31B second; both take images). Dead and removed:
#               meta-llama/llama-3.3-70b-instruct:free, qwen/qwq-32b:free, qwen/qwen3.6-plus-preview:free, openai/gpt-oss-120b:free.
#   groq        free: openai/gpt-oss-120b, openai/gpt-oss-20b, qwen/qwen3.8-27b: 30 requests/min, 1,000/day, 8,000 tokens/MIN each.
#               8,000 tokens/min is smaller than a typical SQL prompt, so Groq only gets the short tasks first.
#   nvidia_nim  free trial API (build.nvidia.com), 40 requests/min, long context.
#   gemini      gemini-3.1-flash-lite (about 500 requests/day, 15/min). Do NOT add gemini-3.5-flash-lite / 3.6 / newer here yet:
#               Google changed their API (thinking_level instead of the thinkingBudget:0 this client sends) and they answer 400.
# Data note: free endpoints (NVIDIA, Google free tier, OpenRouter free) may log prompts or use them to improve models.

