# Provider routing configuration
# Each task maps to an ordered fallback chain of provider+model pairs.
# The router tries them in priority order, falling back on rate-limit or error.
#
# Every model below is a FREE tier model. IDs and limits were checked against the providers' own docs and live catalogs on
# 2026-11-05. Free listings rotate (a model free in July can be paid or gone by October), so re-check before relying on one.
#
#   gemini      free: gemini-3.1-flash-lite and gemini-3.5-flash-lite, about 500 requests/day EACH (the counters are per model, so
#               listing both doubles the daily room). gemini-3.8-flash / 3.6-flash are free but only 20 requests/day: not used here.
#               Google may use free-tier content to improve its products.
#   groq        free: openai/gpt-oss-120b, openai/gpt-oss-20b, qwen/qwen3.8-27b: each 30 requests/min, 1,000/day, 8,000 tokens/MIN,
#               200,000 tokens/day. The 8,000 tokens/min cap is smaller than a typical SQL prompt (schema + rules), so Groq is
#               placed after nvidia_nim for the large-prompt tasks and kept first only for short ones (titles, classification).
#   nvidia_nim  free trial API (build.nvidia.com): 40 requests/min, 1M context on the long models.
#   openrouter  free ":free" models: 20 requests/min and only 50 requests/day (1,000/day after $10 of lifetime credit purchases),
#               so it is a last resort. Dead and removed: meta-llama/llama-3.3-70b-instruct:free, qwen/qwq-32b:free,
#               qwen/qwen3.6-plus-preview:free, openai/gpt-oss-120b:free.
#
# Data note: free endpoints (NVIDIA, Google free tier, OpenRouter free) may log prompts or use them to improve models.

